/* Tattoo Finder — imágenes completas, sin recorte */

.tattoo-grid{
  width:100%;
  max-width:none;
  display:grid;
  gap:8px;
  grid-template-columns:repeat(3,minmax(0,1fr));
}

@media (min-width:768px){
  .tattoo-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
}

@media (min-width:1024px){
  .tattoo-grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
  }
}

.tattoo-card{
  min-width:0;
}

.tattoo-card-image{
  height:140px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:4px;
}

@media (min-width:768px){
  .tattoo-card-image{
    height:155px;
  }
}

.tattoo-card-info{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
  padding:4px 4px 6px;
  line-height:1.25;
}

.tattoo-card-info h3{
  font-size:11px;
  font-weight:700;
  line-height:1.25;
  word-break:break-word;
}

.tattoo-card-info p{
  font-size:10px;
  line-height:1.25;
  margin:0;
}

.tattoo-card-info .tattoo-card-meta{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}

/* Detalle — lado a lado en escritorio, apilado en móvil */

.tattoo-detail{
  display:flex;
  flex-direction:row;
  gap:12px;
  height:90vh;
  max-height:90vh;
  width:94vw;
  max-width:1200px;
  padding:5px 12px 12px;
  background:#09090b;
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
  overflow:hidden;
  touch-action:auto;
}

.tattoo-detail-image{
  flex:1.63 1 0%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  min-height:0;
  min-width:0;
  max-height:100%;
  overflow:hidden;
  border-radius:14px;
  position:relative;
  padding:4px 10px 10px;
  touch-action:none;
}

.tattoo-detail-info{
  flex:1 1 0%;
  width:260px;
  max-width:300px;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:10px;
  overflow-y:auto;
  background:#18181b;
  border-radius:14px;
  touch-action:auto;
}

.tattoo-detail-zoom{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  flex-shrink:1;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

/* Detalle en móvil: auto-adaptación a cada pantalla (iPhone chico/grande,
   con notch o con barra de Safari). Solo móvil: escritorio queda intacto.
   100vh es el fallback; svh/dvh descuentan la barra del navegador para
   que no sobre pantalla arriba ni abajo. */

@media (max-width:768px){
  .tattoo-detail-modal{
    height:100vh;
    height:100svh;
    height:100dvh;
    min-height:100vh;
    min-height:100svh;
    min-height:100dvh;
    padding:0;
    display:flex;
    align-items:stretch;
    justify-content:stretch;
  }

  .tattoo-detail{
    flex-direction:column;
    overflow:hidden;
    gap:8px;
    width:100%;
    max-width:none;
    height:100%;
    max-height:100%;
    height:100vh;
    height:100svh;
    height:100dvh;
    margin:0;
    padding-top:calc(env(safe-area-inset-top, 0px) + 6px);

    padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
    padding-left:8px;
    border-radius:0;
  }

  .tattoo-detail-image{
    flex:1 1 0%;
    width:100%;
    height:auto;
    max-height:none;
    min-height:0;
  }

  .tattoo-detail-info{
    flex:0 1 auto;
    width:100%;
    max-width:none;
    overflow-y:auto;
    min-height:0;
    padding-bottom:10px;
  }

  .tattoo-detail-img{
    max-height:100%;
  }
}

.tattoo-card-img{
  max-width:100%;
  max-height:100%;
  width:100%;
  height:auto;
  -o-object-fit:contain;
     object-fit:contain;
  image-orientation:from-image;
  display:block;
}

.tattoo-detail-img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  -o-object-fit:contain;
     object-fit:contain;

  display:block;
  flex:0 1 auto;
  box-sizing:border-box;
  border:1px solid #d1d5db;
  touch-action:none;
}

/* Mosaico — CSS columns: la tarjeta crece con el área real (Ancho × Alto) */

.tattoo-mosaic{
  width:100%;
  max-width:none;
  -moz-columns:3;
       columns:3;
  -moz-column-gap:8px;
       column-gap:8px;
}

@media (min-width:768px){
  .tattoo-mosaic{
    -moz-columns:4;
         columns:4;
  }
}

@media (min-width:1024px){
  .tattoo-mosaic{
    -moz-columns:6;
         columns:6;
  }
}

.tattoo-mosaic .tattoo-card{
  -moz-column-break-inside:avoid;
       break-inside:avoid;
  margin-bottom:8px;
  width:100%;
  display:inline-block;
}

.tattoo-mosaic-image{
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:4px;
}

.tattoo-mosaic-img{
  width:100%;
  height:100%;
  max-width:100%;
  -o-object-fit:contain;
     object-fit:contain;
  image-orientation:from-image;
  display:block;
}

.tattoo-mosaic-img-natural{
  height:auto;
}

/* Filtros: solo en iPhone / pantallas angostas (max-width: 768px).
   Escritorio queda exactamente igual: una sola línea.
   Móvil: 1ª línea FILTROS centrado · 2ª línea Categoría + Tamaño (50% / 50%)
   · 3ª línea Mostrando… centrado. */

@media (max-width:768px){

    flex-wrap:wrap;
    row-gap:8px;
    -moz-column-gap:0;

  }

  .tattoo-filters .filters-label{

    width:100%;
    text-align:center;
  }

  .tattoo-filters .filter-field{
    flex:1 1 50%;
    flex-basis:50%;
    max-width:50%;
    min-width:0;

    padding:0 3px;
    height:32px;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }

  .tattoo-filters .filter-field>span:first-child{
    flex:0 0 auto;
  }

  .tattoo-filters .filter-field>span:last-child{

    display:block;
  }

  .tattoo-filters .filter-field select{

    width:100%;
    max-width:100%;
    min-width:0;
    box-sizing:border-box;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .tattoo-filters .filters-count{
    flex:0 0 100%;
    width:100%;
    margin-left:0;
    text-align:center;
  }

  .tattoo-filters .filters-clear{
    flex:0 0 100%;
    width:100%;
    margin-left:0;
    text-align:center;
  }

  .tattoo-filters .filters-cleared{
    flex:0 0 100%;
    width:100%;
    text-align:center;
  }
}

    var colCells=[]; for(var cy3=0;cy3<4;cy3++) for(var cx3=0;cx3<4;cx3++){ var sr=0,sg=0,sb=0,cnt=0; for(var yy3=cy3*32;yy3<(cy3+1)*32;yy3++) for(var xx3=cx3*32;xx3<(cx3+1)*32;xx3++){ var id3=yy3*128+xx3; if(ink[id3]){ sr+=d[id3*4]; sg+=d[id3*4+1]; sb+=d[id3*4+2]; cnt++; } } if(cnt){ colCells.push(sr/cnt,sg/cnt,sb/cnt); } else { colCells.push(255,255,255); } }
    // Hist de tono solo de tinta + densidad por bloque, igual que el generador
    var hueHist=[]; for(var hh2=0;hh2<13;hh2++) hueHist.push(0); var hueTot2=0;
    for(var ii2=0;ii2<128*128;ii2++){ if(!ink[ii2]) continue; var rr=d[ii2*4], gg=d[ii2*4+1], bb=d[ii2*4+2]; var mx=Math.max(rr,gg,bb), mn=Math.min(rr,gg,bb); var st2=mx>10?(mx-mn)/mx:0; if(st2<0.15){ hueHist[12]++; } else { var hue2=0; if(mx!==mn){ if(mx===rr) hue2=60*(((gg-bb)/(mx-mn))%6); if(mx===gg) hue2=60*((bb-rr)/(mx-mn)+2); if(mx===bb) hue2=60*((rr-gg)/(mx-mn)+4); } if(hue2<0) hue2+=360; var hb2=Math.min(11,Math.floor(hue2/30)); hueHist[hb2]++; } hueTot2++; }

    return {hash:bits,hist:hist,aspect:aspect,inkColor:inkColor,inkRatio:inkRatio,hog:hog,colCells:colCells,hueHist:hueHist,density:density};
  }catch(_){return null;}
}
function loadThumb(u){return new Promise(function(res){var im=new Image(); im.crossOrigin='anonymous'; var done=false; var to=setTimeout(function(){if(!done){done=true; res(null);}},5000); im.onload=function(){if(!done){done=true; clearTimeout(to); res(im);}}; im.onerror=function(){if(!done){done=true; clearTimeout(to); res(null);}}; im.src=proxyUrl(u);});}
function histD(a,b){var s=0; for(var i=0;i<a.length;i++){var d=a[i]-b[i]; s+=d*d;} return Math.sqrt(s);}
function hashD(a,b){var s=0; for(var i=0;i<Math.min(a.length,b.length);i++){if(a[i]!==b[i]) s++;} return s/Math.max(1,Math.min(a.length,b.length));}
var SIMILARIDAD_MINIMA=0.60; var MAX_SIMILARES=50;
function parseHuellaStr(s){ try{ if(!s) return null; var p=String(s).split('|'); if(p.length<5) return null; var hex=p[0]; var bits=[]; for(var i=0;i<hex.length;i++){ var v=parseInt(hex[i],16); bits.push((v>>3)&1,(v>>2)&1,(v>>1)&1,v&1); } var hist=p[1].split(',').map(function(x){return parseFloat(x)||0;}); var col=p[2].split(','); var color={r:parseFloat(col[0])||0,g:parseFloat(col[1])||0,b:parseFloat(col[2])||0}; var hog=null; if(p.length>=6&&p[5]){ hog=p[5].split(',').map(function(x){return parseFloat(x)||0;}); } var colCells=null; if(p.length>=7&&p[6]){ colCells=p[6].split(',').map(function(x){return parseFloat(x)||0;}); } var hueHist=null; if(p.length>=8&&p[7]){ hueHist=p[7].split(',').map(function(x){return parseFloat(x)||0;}); } var density=null; if(p.length>=9&&p[8]){ density=p[8].split(',').map(function(x){return parseFloat(x)||0;}); } return {bits:bits,hist:hist,color:color,aspect:parseFloat(p[3])||1,inkRatio:parseFloat(p[4])||0,hog:hog,colCells:colCells,hueHist:hueHist,density:density}; }catch(_){ return null; } }
function simHuella(q, st){ if(!q||!st) return 0; var hd=0; var n=Math.min(q.hash.length, st.bits.length); for(var i=0;i<n;i++){ if(q.hash[i]!==st.bits[i]) hd++; } hd=hd/Math.max(1,n);
  // FIX: antes habia un corte duro en hd>0.42 que dejaba todo en 30% maximo.
  // Dos flores distintas difieren mas del 42% en pixeles aunque sean flores.
  // Lo quitamos, que decida HOG + color, no solo pixeles.
  var hogD=0, hasHog=false;
  if(q.hog && st.hog && q.hog.length===st.hog.length){ hasHog=true; var ss=0; for(var hh=0;hh<q.hog.length;hh++){ var dd=q.hog[hh]-st.hog[hh]; ss+=dd*dd; } hogD=Math.sqrt(ss); if(hogD>1.5) hogD=1.5; hogD=hogD/1.5; }
  var colCellD=0, hasCell=false;
  if(q.colCells && st.colCells && q.colCells.length===st.colCells.length){ hasCell=true; var cc=0, cntC=0; for(var k2=0;k2<q.colCells.length;k2+=3){ if(q.colCells[k2]<0 || st.colCells[k2]<0) continue; var dr=(q.colCells[k2]-st.colCells[k2])/255, dg=(q.colCells[k2+1]-st.colCells[k2+1])/255, db=(q.colCells[k2+2]-st.colCells[k2+2])/255; cc+=Math.sqrt(dr*dr+dg*dg+db*db)/1.732; cntC++; } colCellD=cntC?cc/cntC:1; }
  var projD=0; for(var r=0;r<64;r++){ var s1=0,s2=0; for(var c=0;c<64;c++){ s1+=q.hash[r*64+c]; s2+=st.bits[r*64+c]; } projD+=Math.abs(s1-s2)/64; } projD/=64;
  var blockD=0; for(var br=0;br<8;br++) for(var bc=0;bc<8;bc++){ var b1=0,b2=0; for(var y=0;y<8;y++) for(var x=0;x<8;x++){ b1+=q.hash[(br*8+y)*64+(bc*8+x)]; b2+=st.bits[(br*8+y)*64+(bc*8+x)]; } blockD+=Math.abs(b1-b2)/64; } blockD/=64;
  var hsd=0; for(var j=0;j<Math.min(q.hist.length, st.hist.length); j++){ var d=q.hist[j]-st.hist[j]; hsd+=d*d; } hsd=Math.sqrt(hsd)/Math.SQRT2; if(hsd>1)hsd=1;
  var dR=(q.inkColor.r-st.color.r)/255, dG=(q.inkColor.g-st.color.g)/255, dB=(q.inkColor.b-st.color.b)/255; var colD=Math.sqrt(dR*dR+dG*dG+dB*dB)/1.732;
  // Candado de color: morado/color fuerte vs gris/negro no deben mezclarse aunque la forma sea parecida
  var qMax=Math.max(q.inkColor.r,q.inkColor.g,q.inkColor.b), qMin=Math.min(q.inkColor.r,q.inkColor.g,q.inkColor.b);
  var sMax=Math.max(st.color.r,st.color.g,st.color.b), sMin=Math.min(st.color.r,st.color.g,st.color.b);
  var qSat=qMax>10 ? (qMax-qMin)/qMax : 0;
  var sSat=sMax>10 ? (sMax-sMin)/sMax : 0;
  var satDiff=Math.abs(qSat-sSat);
  var aspD=Math.abs(q.aspect-st.aspect)/Math.max(q.aspect, st.aspect, 0.0001); if(aspD>1)aspD=1;
  var ratioD=Math.abs(q.inkRatio-st.inkRatio); if(ratioD>1)ratioD=1;
  var hueD=0, hasHue=false;
  if(q.hueHist && st.hueHist && q.hueHist.length===st.hueHist.length){ hasHue=true; var sh=0; for(var hhi=0;hhi<q.hueHist.length;hhi++){ var dh=q.hueHist[hhi]-st.hueHist[hhi]; sh+=dh*dh; } hueD=Math.sqrt(sh)/Math.SQRT2; if(hueD>1)hueD=1; }

  if(q.density && st.density && q.density.length===st.density.length){ hasDen=true; var sd=0; for(var di=0;di<q.density.length;di++){ var dd2=q.density[di]-st.density[di]; sd+=dd2*dd2; } denD=Math.sqrt(sd/64); if(denD>1)denD=1; }
  var v;
  if(hasHog){ if(hasHue&&hasDen){ v=1-(0.20*hogD+0.18*hd+0.20*hueD+0.15*colCellD+0.12*denD+0.06*colD+0.04*hsd+0.03*aspD+0.02*ratioD); } else { v=1-(0.25*hogD+0.22*hd+0.22*colCellD+0.15*blockD+0.07*colD+0.04*hsd+0.03*aspD+0.02*ratioD); } }

  if(satDiff>0.30 && hd>0.05){ v=Math.min(v, 0.55); }

  if(v<0)v=0; if(v>1)v=1;
  // Identica siempre primero: si la mancha es casi igual, es la misma foto aunque venga recomprimida
  if(hd<0.05 && hogD<0.30) v=1;
  else if(hd<0.08 && colD<0.10 && hogD<0.35) v=Math.max(v, 0.98);
  return v; }

var topRow=null, thumbImg=null, statusEl=null, xBtn=null, resultsWrap=null, resultsGrid=null, fileInput=null;
function buildTop(){
  if(topRow) return;
  var inp=document.querySelector('input[aria-label="Buscar tattoos"]');
  var wrap=null;
  if(inp){ wrap=inp.parentElement; }
  topRow=document.createElement('div'); topRow.className='tf-top-row';
  topRow.innerHTML='<img class="tf-top-thumb" alt="Foto buscada"><span class="tf-top-status"></span><button type="button" class="tf-top-x">×</button><button type="button" class="tf-top-cam" title="Buscar por foto">📷</button>';
  if(wrap && wrap.parentNode) wrap.parentNode.insertBefore(topRow, wrap);
  else {
    var root=document.getElementById('root');
    if(root&&root.parentNode) root.parentNode.insertBefore(topRow, root);
    else document.body.insertBefore(topRow, document.body.firstChild);
  }
  resultsWrap=document.createElement('div'); resultsWrap.className='tf-photo-results-wrap'; resultsWrap.style.display='none';
  resultsGrid=document.createElement('div'); resultsGrid.className='tattoo-grid tf-photo-grid';
  resultsWrap.appendChild(resultsGrid);
  var grid=document.querySelector('#root .tattoo-grid, #root .tattoo-mosaic');
  if(grid && grid.parentNode) grid.parentNode.insertBefore(resultsWrap, grid);
  else { var filters=document.querySelector('.tattoo-filters'); if(filters && filters.parentNode) filters.parentNode.insertBefore(resultsWrap, filters.nextSibling); else if(wrap && wrap.parentNode) wrap.parentNode.insertBefore(resultsWrap, wrap.nextSibling); else document.body.appendChild(resultsWrap); }
  thumbImg=topRow.querySelector('.tf-top-thumb'); statusEl=topRow.querySelector('.tf-top-status'); xBtn=topRow.querySelector('.tf-top-x');
  fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  fileInput.addEventListener('change',function(){ if(fileInput.files&&fileInput.files[0]) onPick(fileInput.files[0]); fileInput.value=''; });
  document.body.appendChild(fileInput);
  topRow.querySelector('.tf-top-cam').addEventListener('click',function(){ fileInput.click(); });
  xBtn.addEventListener('click',function(){ clearPhoto(); });
}
function ensurePosition(){
  var inp=document.querySelector('input[aria-label="Buscar tattoos"]');
  if(!inp || !topRow) return;
  var searchWrap=inp.parentElement;
  if(searchWrap && topRow.nextSibling!==searchWrap){
    if(searchWrap.parentNode) searchWrap.parentNode.insertBefore(topRow, searchWrap);
  }
  var grid=document.querySelector('#root .tattoo-grid:not(.tf-photo-grid), #root .tattoo-mosaic');
  if(grid && resultsWrap && resultsWrap.nextSibling!==grid){
    if(grid.parentNode) grid.parentNode.insertBefore(resultsWrap, grid);
  }
}
function setStatus(t,done){ if(!statusEl) return; statusEl.textContent=t||''; statusEl.classList.toggle('done',!!done); }
function renderProgress(){
  if(!resultsGrid) return;
  var inp=document.querySelector('input[aria-label="Buscar tattoos"]'); var q=(inp?inp.value:'').trim().toLowerCase();
  var list=(S.items||[]).filter(function(it){ return S.scored && S.scored[it.clave]; });
  list.sort(function(a,b){ return ((S.scores||{})[b.clave]||-1)-((S.scores||{})[a.clave]||-1); });
  list=list.filter(function(it){ return ((S.scores||{})[it.clave]||0) >= SIMILARIDAD_MINIMA; });
  if(q){
    list=list.filter(function(it){
      var hay=(it.clave+' '+it.cat+' '+it.keys+' '+it.color+' '+it.size).toLowerCase();
      return q.split(/\s+/).every(function(w){ return hay.indexOf(w)!==-1; });
    });
  }
  var show=list.slice(0,MAX_SIMILARES);
  resultsGrid.innerHTML='';
  show.forEach(function(it){
    var art=document.createElement('article');
    art.className='tattoo-card rounded-[10px] overflow-hidden bg-white border border-zinc-100 shadow-[0_6px_24px_rgba(0,0,0,0.05)] cursor-pointer hover:shadow-[0_14px_36px_rgba(0,0,0,0.10)] transition';
    art.innerHTML='<div class="tattoo-card-image"><img class="tattoo-card-img" src="'+thumbUrl(it.img)+'" alt="'+it.clave+'"></div><div class="tattoo-card-info"><h3>'+it.clave+'</h3><p class="text-zinc-700 font-semibold">'+(it.size||'')+'</p><p class="text-zinc-500 tattoo-card-meta"><span>'+(it.ancho||'')+' × '+(it.alto||'')+' cm</span></p><p class="text-zinc-500 break-words">'+(it.categoria||'')+'</p></div>';
    art.addEventListener('click',function(){ if(S.comparing) return; openDetailFor(it.clave); }); if(S.comparing){ art.style.pointerEvents='none'; art.style.opacity='0.6'; }
    resultsGrid.appendChild(art);
  });

    resultsWrap.style.display='block';
    document.body.classList.add('tf-photo-done');
  }
}
function clearPhoto(){
  S.gen++; S.comparing=false;
  if(S.url){try{URL.revokeObjectURL(S.url);}catch(_){}}
  S.url=null; S.hash=null; S.hist=null; S.aspect=0; S.hog=null; S.colCells=null; S.hueHist=null; S.density=null; S.scores=null; S.scored=null; S.photoOpenedClave=null;
  try{ var inp2=document.querySelector('input[aria-label="Buscar tattoos"]'); if(inp2){ var setter2=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set; setter2.call(inp2,''); inp2.dispatchEvent(new Event('input',{bubbles:true})); } }catch(_){}
  if(thumbImg){thumbImg.style.display='none'; thumbImg.src='';}
  if(statusEl) statusEl.textContent='';
  if(xBtn) xBtn.style.display='none';
  if(resultsWrap) resultsWrap.style.display='none';
  document.body.classList.remove('tf-photo-done');
}
function openDetailFor(clave){
  if(S.comparing) return; S.photoOpenedClave=clave;
  var inp=document.querySelector('input[aria-label="Buscar tattoos"]'); if(!inp) return;
  try{ var setter=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value').set; setter.call(inp, clave); inp.dispatchEvent(new Event('input',{bubbles:true})); }catch(_){}
  setTimeout(function(){
    var cards=$all('#root .tattoo-card');
    for(var i=0;i<cards.length;i++){ var h=cards[i].querySelector('h3'); if(h&&h.textContent.trim()===clave){ cards[i].click(); break; } }
    document.body.classList.remove('tf-photo-done');
    setTimeout(function(){ if(S.scores) document.body.classList.add('tf-photo-done'); }, 800);
  }, 400);
}
function onPick(file){
  buildTop(); ensurePosition();
  S.gen++; var my=S.gen;
  var url=URL.createObjectURL(file);
  if(S.url){try{URL.revokeObjectURL(S.url);}catch(_){}}
  S.url=url;
  thumbImg.src=url; thumbImg.style.display='block';
  xBtn.style.display='grid';
  if(resultsWrap) resultsWrap.style.display='none';
  document.body.classList.remove('tf-photo-done');
  setStatus('Analizando…', false);
  var im=new Image();
  im.onload=function(){
    if(my!==S.gen) return;
    var f=feat(im); if(!f){ setStatus('No pude leer esa foto', false); return; }
    S.hash=f.hash; S.hist=f.hist; S.aspect=f.aspect; S.inkColor=f.inkColor; S.inkRatio=f.inkRatio; S.hog=f.hog; S.colCells=f.colCells; S.hueHist=f.hueHist; S.density=f.density; window.__tfQCol=f.inkColor; window.__tfQRatio=f.inkRatio; rank(my);
  };
  im.onerror=function(){ setStatus('No pude leer esa foto', false); };
  im.src=url;
}
async function rank(my){
  await sleep(10); if(my!==S.gen) return;
  var items=await getCatalog(); if(!items.length){ setStatus('No pude leer el catálogo', false); return; }
  var withH=items.filter(function(it){ return it.huella && it.huella.length>100; });
  if(!withH.length){ setStatus('Aún no hay huellas en este CSV', false); return; }
  S.comparing=true;
  setStatus('Comparando huellas… 0 / '+withH.length, false);
  var q={hash:S.hash,hist:S.hist,aspect:S.aspect,inkColor:S.inkColor,inkRatio:S.inkRatio,hog:S.hog,colCells:S.colCells,hueHist:S.hueHist,density:S.density};
  var scores={}; var scored={};
  for(var i=0;i<withH.length;i++){
    if(my!==S.gen) { S.comparing=false; return; }
    var st=parseHuellaStr(withH[i].huella);
    if(!st) continue;
    var v=simHuella(q, st);
    scores[withH[i].clave]=v; scored[withH[i].clave]=true;
    if(i%200===0){ S.scores=scores; S.scored=scored; setStatus('Comparando huellas… '+i+' / '+withH.length, false); renderProgress(); await sleep(0); }
  }
  if(my!==S.gen) { S.comparing=false; return; }
  S.scores=scores; S.scored=scored; S.comparing=false;
  var shown=0; for(var k in scores){ if(scores[k]>=SIMILARIDAD_MINIMA) shown++; }
  setStatus('Listo - '+shown+' similares (de '+withH.length+' con huella)', true);
  renderProgress();
}
buildTop();
setInterval(ensurePosition, 400);
document.addEventListener('input',function(e){
  if(e.target&&e.target.getAttribute&&e.target.getAttribute('aria-label')==='Buscar tattoos'){
    if(S.scores) renderProgress();
  }
},true);
})();
